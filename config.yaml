# ZenSift settings. Keep secrets in .env.

# One concrete topic per entry. Put exclusions in `avoid`; embeddings don't handle negation.
interests:
  - Admission requirements, scholarships, tuition and student visa rules for
    AI and machine learning master's programs at German universities
  - New open-source and open-weight large language model (LLM) releases,
    benchmarks and licenses, such as Llama, Mistral, Qwen and DeepSeek

# Articles must match an interest clearly better than an avoid topic.
avoid:
  - Partisan political fights, diplomatic disputes, government bans, sanctions, and politicians attacking each other
  - Tech industry geopolitics, federal restrictions, trade wars, and national security bans on AI software
  - Outrage, scandal and rage-bait stories written to provoke anger
  - Celebrity, athlete and influencer gossip and personal stories

# Sifter settings.
sifter:
  similarity_threshold: 0.65 # Minimum topic similarity.
  min_margin: 0.05 # Minimum lead over the closest avoid topic.
  max_articles: 8 # Maximum stories to summarize.
  # Publisher domains to skip before scoring.
  exclude_sources:
    - shiksha.com
    - telegraphindia.com
    - indiaai.gov.in
    - tech-insider.org

# Tone filters applied after summary scoring (1 = calm, 0 = alarmist).
digest:
  hard_drop_tone: 0.15 # Always drop below this tone.
  avoid_drop_tone: 0.40 # Drop avoid-adjacent stories below this tone.
  avoid_hit_similarity: 0.60 # Defines an avoid-topic match.
