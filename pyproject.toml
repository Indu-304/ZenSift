[project]
name = "zensift"
version = "0.1.0"
description = ""
authors = [
    {name = "indu-304", email = "d.indusree@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph (>=1.2.16,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "feedparser (>=6.0.14,<7.0.0)",
    "resend (>=2.50.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain-google-genai (>=4.4.2,<5.0.0)",
    "tenacity (>=9.1.4,<9.2.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "langsmith (>=0.14.11,<1.0.0)",
    "langchain-core (>=1.6.12,<2.0.0)",
    "googlenewsdecoder (>=0.2.2,<0.3.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "ragas (==0.4.3)",
    "langchain-community (<0.4)",
    "instructor (>=1.3)"
]
